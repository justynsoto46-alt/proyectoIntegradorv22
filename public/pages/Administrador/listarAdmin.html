<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Administradores</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/css/paginas/menuPrincipal.css">
    <link rel="stylesheet" href="/css/paginas/listarAdmin.css">

</head>

<body>

<header class="encabezado">

    <div class="contenedor">

        <img src="/img/LogoBlanco.png"
            alt="Logo CENFOTEC"
            class="logo">

        <h1>CENFOTEC Página Web Eventos</h1>

        <div class="usuario">

            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user"></i>

            <span>Administrador</span>

        </div>

    </div>

</header>

<main>

        <!-- El menú lateral se carga desde /partials/navbar.html -->
        <div id="navbar"></div>

<section class="contenido-principal">

<div class="tarjeta-admin">

<div class="encabezado-listado">

<h2>Consultar Administradores</h2>

<a href="/pages/Administrador/registrarAdministrador.html"
class="boton">

<i class="fa-solid fa-user-plus"></i>

Nuevo Administrador

</a>

</div>

<div class="barra-filtros">

<div class="campo-busqueda">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="buscarAdmin"
placeholder="Buscar por nombre o correo electrónico...">

</div>

<select
id="filtroEstado"
class="selector-estado">

<option value="">Estado: Todos</option>
<option value="Administrador">Administrador</option>
<option value="Supervisor">Supervisor</option>

</select>

</div>

<table class="tabla-admin">

<thead>

<tr>

<th>Imagen</th>
<th>Nombre Completo</th>
<th>Correo Electrónico</th>
<th>Rol</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="cuerpoTablaAdministradores">
                        <!-- Las filas se agregan dinámicamente desde JavaScript -->
                    </tbody>

</table>

<p id="sinResultados" class="sin-resultados" style="display:none;">
    No se encontraron administradores que coincidan con la búsqueda.
</p>

</div>

</section>

</main>

<footer>

<h2>Somos lo que sabemos</h2>

<p>&copy; 2026 Universidad CENFOTEC</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/comunes/avisos.js"></script>
<script src="/js/comunes/navbar.js"></script>
<script src="/js/comunes/sesion.js"></script>
<script
    type="module"
    src="/js/controllers/listarAdministradoresController.js">
</script>

</body>

</html>
