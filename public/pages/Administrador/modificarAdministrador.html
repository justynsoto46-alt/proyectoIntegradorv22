<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENFOTEC Página Web Eventos - Modificar  Administrador</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <!-- FontAwesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos generales -->
    <link rel="stylesheet" href="/css/paginas/menuPrincipal.css">

    <!-- Estilos propios de la pantalla -->
    <link rel="stylesheet" href="/css/paginas/modificarAdmin.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="encabezado">
        <div class="contenedor">

            <img src="/img/LogoBlanco.png"
                alt="Logo Universidad CENFOTEC"
                class="logo">

            <h1>CENFOTEC Página Web Eventos</h1>

            <div class="usuario">
                <i class="fa-solid fa-user"></i>
                Administrador
            </div>
        </div>

    </header>
    <main>
        <!-- Menú lateral -->
        <!-- El menú lateral se carga desde /partials/navbar.html -->
        <div id="navbar"></div>

        <!-- Contenido principal -->
        <section class="section">
            <div class="contenedor formulario-contenedor">

                <h2>Modificar Administrador</h2>

                <p class="descripcion">
                    Actualice la información personal del Administrador seleccionado.
                </p>

                <form id="formularioAdministrador" class="formulario" action="#" method="post" novalidate>
                    <label for="nombreCompleto">
    Nombre completo *
</label>
<input type="text"
    id="nombreCompleto"
    placeholder="Nombre completo del participante"
    value="Ivannia Quesada" required>

<label for="fotoAdministrador">
    Imagen del Administrador
</label>
<input type="file"
    id="fotoAdministrador"
    name="fotoAdministrador"
    accept="image/*">

<label for="correo">
    Correo electrónico *
</label>

                    <input type="email"
                        id="correo"
                        placeholder="correo@ejemplo.com"
                        value="iquesadab@ucenfotec.ac.cr" >

                    <label for="rol">Seleccione un Rol</label>
                    <select name="rol" id="rol">
                        <option value="Administrador">
                        Administrador
                        </option>
                        <option value="Responsable">
                        Responsable
                        </option>
                        <option value="Participante">
                        Participante
                        </option>
                    </select>


                    <div class="botones">

                        <button type="submit" class="boton-principal">
                            Guardar cambios
                        </button>

                        <button type="button"
                            id="btnCancelar"
                            class="boton-secundario">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <h2>Somos lo que sabemos</h2>
        <p>&copy; 2026 Universidad CENFOTEC</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/comunes/avisos.js"></script>
    <script src="/js/comunes/navbar.js"></script>
    <script src="/js/comunes/sesion.js"></script>
    <script
        type="module"
        src="/js/controllers/modificarAdministradorController.js">
    </script>
</body>
</html>
