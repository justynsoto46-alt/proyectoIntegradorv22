<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Selección de Actividades</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/paginas/seleccionarActividades.css"
    >
</head>

<body>

    <main>

        <section class="seccion-actividades">

            <div class="contenedor">

                <h2>
                    Selección de Actividades
                </h2>

                <p class="descripcion">
                    Seleccione las actividades a las que desea inscribirse.
                </p>


                <!--
                    Aquí se cargarán automáticamente
                    las actividades registradas en MongoDB
                -->
                <div
                    id="contenedorActividades"
                    class="contenedor-actividades"
                >
                </div>


                <!-- Acciones finales -->
                <div class="acciones-finales">

                    <button
                        type="button"
                        id="btnFinalizar"
                        class="boton-finalizar"
                    >
                        Finalizar inscripción
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <h2>
            Somos lo que sabemos
        </h2>

        <p>
            &copy; 2026 Universidad Cenfotec
        </p>

    </footer>


    <!-- SweetAlert -->
    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>


    <!-- Funciones comunes de avisos -->
    <script
        src="/js/comunes/avisos.js">
    </script>


    <!-- Controller de selección de actividades -->
    <script
        type="module"
        src="/js/controllers/seleccionarActividadesController.js">
    </script>

</body>

</html>
