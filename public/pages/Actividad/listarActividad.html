<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Actividad</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="/css/paginas/menuPrincipal.css">
<link rel="stylesheet" href="/css/paginas/listarActividad.css">

</head>

<body>

    <header class="encabezado">

        <div class="contenedor">

            <img src="/img/LogoBlanco.png" alt="Logo de CENFOTEC" class="logo">

            <h1>CENFOTEC Página Web Eventos</h1>

            <div class="usuario">

                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-user"></i>

                <span>Administrador</span>

            </div>

        </div>

    </header>

    <main>

        <!-- El menú lateral se carga desde /partials/navbar.html -->
        <div id="navbar"></div>

        <section class="section">

            <div class="contenedor tarjeta-actividad">

                <div class="encabezado-listado">

                    <h2>Consultar Actividades</h2>

                    <a href="/pages/Actividad/registrarActividad.html" class="boton boton-primario">
                        <i class="fa-solid fa-book-medical"></i>
                        Nueva Actividad
                    </a>

                </div>

                <div class="barra-filtros">

                    <div class="campo-busqueda">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="text"
                            id="buscarActividad"
                            name="buscarActividad"
                            placeholder="Buscar por nombre, responsable o descripción...">
                    </div>

                    <select id="filtroEstado" name="filtroEstado">
                        <option value="">Estado: Todos</option>
                        <option value="Activo">Activo</option>
                        <option value="Suspendido">Suspendido</option>
                        <option value="Finalizada">Finalizada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>

                </div>

                <table class="tabla-actividad" id="tablaActividades">

                    <thead>

                        <tr>

                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Horario</th>
                            <th>Cupo máximo</th>
                            <th>Cupos disponibles</th>
                            <th>Responsable</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="cuerpoTablaActividades">
                        <!-- Las filas se agregan dinámicamente desde JavaScript -->
                    </tbody>

                </table>

                <p id="sinResultados" class="sin-resultados" style="display: none;">
                    No se encontraron actividades que coincidan con la búsqueda.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <h2>Somos lo que sabemos</h2>

        <p>&copy; 2026 Universidad CENFOTEC</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/comunes/avisos.js"></script>
    <script src="/js/comunes/navbar.js"></script>
    <script src="/js/comunes/sesion.js"></script>
    <script
        type="module"
        src="/js/controllers/listarActividadesController.js">
    </script>
</body>
</html>
