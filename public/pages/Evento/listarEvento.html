<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Evento</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/css/paginas/menuPrincipal.css">
    <link rel="stylesheet" href="/css/paginas/listarEvento.css">

</head>

<body>

    <header class="encabezado">

        <div class="contenedor">

            <img src="/img/LogoBlanco.png" alt="Logo de CENFOTEC" class="logo">

            <h1>CENFOTEC Página Web Eventos</h1>

            <div class="usuario">

                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-user"></i>

                <span>Administrador</span>

            </div>

        </div>

    </header>

    <main>

        <!-- El menú lateral se carga desde /partials/navbar.html -->
        <div id="navbar"></div>

        <section class="section">

            <div class="contenedor tarjeta-evento">

                <div class="encabezado-listado">

                    <h2>Consultar Eventos</h2>

                    <a href="/pages/Evento/registrarEvento.html" class="boton boton-primario">
                        <i class="fa-solid fa-calendar-plus"></i>
                        Nuevo Evento
                    </a>

                </div>

                <div class="barra-filtros">

                    <div class="campo-busqueda">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="buscarEvento" name="buscarEvento"
                            placeholder="Buscar por nombre del evento...">
                    </div>

                    <select id="filtroEstado" name="filtroEstado">
                        <option value="">Estado: Todos</option>
                        <option value="Activo">Activo</option>
                        <option value="Cancelado">Cancelado</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>

                </div>

                <table class="tabla-evento" id="tablaEventos">

                    <thead>

                        <tr>

                            <th>Nombre</th>
                            <th>Fecha inicio</th>
                            <th>Fecha finalización</th>
                            <th>Ubicación</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="cuerpoTablaEventos">
                        <!-- Las filas se agregan dinámicamente desde JavaScript -->
                    </tbody>

                </table>

                <p id="sinResultados" class="sin-resultados" style="display: none;">
                    No se encontraron eventos que coincidan con la búsqueda.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <h2>Somos lo que sabemos</h2>

        <p>&copy; 2026 Universidad CENFOTEC</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/comunes/avisos.js"></script>
    <script src="/js/comunes/navbar.js"></script>
    <script src="/js/comunes/sesion.js"></script>
    <script
        type="module"
        src="/js/controllers/listarEventosController.js">
    </script>
</body>

</html>
