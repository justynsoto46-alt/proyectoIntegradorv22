<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Evento</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="/css/paginas/menuPrincipal.css">
<link rel="stylesheet" href="/css/paginas/registrarEvento.css">
</head>

<body>

    <header class="encabezado">
        <div class="contenedor">
            <img src="/img/LogoBlanco.png" alt="Logo de CENFOTEC" class="logo">

            <h1>CENFOTEC Página Web Eventos</h1>

            <div class="usuario">
                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-user"></i>
                <span>Administrador</span>
            </div>
        </div>
    </header>

    <main>
        <!-- El menú lateral se carga desde /partials/navbar.html -->
        <div id="navbar"></div>
    
        <section class="section">

            <div class="contenedor tarjeta-evento">

                <h2>Registrar Evento</h2>

                <form
                 id="formularioEvento"
                 class="formulario"
                 action="#"
                 method="post"
                 novalidate>

                    <label for="nombreEvento">
                        Nombre del Evento
                    </label>

                    <input
                        type="text"
                        id="nombreEvento"
                        name="nombreEvento"
                        placeholder="Ingrese el nombre del evento"
                        required>

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="5"
                        placeholder="Ingrese la descripción del evento"
                        required></textarea>

                    <label for="fechaInicio">
                        Fecha de inicio
                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                        name="fechaInicio"
                        required>

                    <label for="fechaFin">
                        Fecha de finalización
                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                        name="fechaFin"
                        required>

                    <label for="ubicacion">
                        Ubicación
                    </label>

                    <input
                        type="text"
                        id="ubicacion"
                        name="ubicacion"
                        placeholder="Ingrese la ubicación"
                        required>

                    <label for="estado">
                        Estado
                    </label>

                    <select
                        id="estado"
                        name="estado"
                        required>

                        <option value="">
                            Seleccione una opción
                        </option>

                        <option value="Activo">
                            Activo
                        </option>

                        <option value="Cancelado">
                            Cancelado
                        </option>

                        <option value="Finalizado">
                            Finalizado
                        </option>

                    </select>

                    <button
                        type="submit"
                        class="boton boton-primario boton-bloque boton-lg">

                        Guardar Evento

                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer>

        <h2>Somos lo que sabemos</h2>

        <p>&copy; 2026 Universidad CENFOTEC</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/comunes/avisos.js"></script>
    <script src="/js/comunes/navbar.js"></script>
    <script src="/js/comunes/sesion.js"></script>
    <script
        type="module"
        src="/js/controllers/registrarEventoController.js">
    </script>
</body>

</html>
